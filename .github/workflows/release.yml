name: Release

# A fallback for building the macOS apps (Apple Silicon, Intel) and the Linux
# x86_64 bundle on GitHub and attaching them to a release. Normally every
# download is built on an Apple Silicon Mac with scripts/ and uploaded by hand
# (it saves Actions minutes, and the Raspberry Pi build takes ~2 min natively
# there versus ~2 h under emulation here), so this only runs when started by
# hand: Actions → Release → Run workflow, with the tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the builds to
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/fetch-submodules.sh
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install ffmpeg pkg-config dylibbundler
      - run: scripts/package-macos.sh
      - run: gh release upload "$TAG" dist/silkscreen-macos-arm64.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # Intel Macs on macOS 11+ (e.g. the 2014 Retina 5K iMac as a display).
  macos-intel:
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - run: brew install nasm
      - run: scripts/package-macos-intel.sh
      - run: gh release upload "$TAG" dist/silkscreen-macos-intel.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [x86_64]
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/fetch-submodules.sh
      - run: scripts/package-linux.sh ${{ matrix.arch }}
      - run: gh release upload "$TAG" dist/silkscreen-linux-${{ matrix.arch }}.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
