name: Release

# Builds what can only be built on GitHub's runners (macOS) and attaches it
# to a published release. The other assets are built with scripts/.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the macOS build to
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install ffmpeg pkg-config dylibbundler
      - run: cargo build --release -p silkscreen
      - name: Bundle with its own FFmpeg
        run: |
          out=dist/silkscreen-macos-arm64
          mkdir -p "$out/lib"
          cp target/release/silkscreen "$out/"
          # Copy Homebrew's FFmpeg and its dependencies next to the binary.
          dylibbundler -od -b -x "$out/silkscreen" -d "$out/lib" -p @executable_path/lib/
          # Rewriting load paths invalidates signatures; Apple Silicon needs one.
          for f in "$out"/lib/*.dylib "$out/silkscreen"; do codesign --force -s - "$f"; done
          cp README.md "$out/"
          "$out/silkscreen" doctor
          (cd dist && zip -qry silkscreen-macos-arm64.zip silkscreen-macos-arm64)
      - run: gh release upload "$TAG" dist/silkscreen-macos-arm64.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
