<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The app icon on Apple's macOS icon grid: the same artwork as
       icon.svg, as an 824 px rounded square centred on the 1024 canvas
       with the standard drop shadow, so it sits like other Dock icons.
       Rendered by scripts/render-icons.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2a4f"/>
      <stop offset="1" stop-color="#0b1226"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g transform="translate(100 100) scale(0.8046875)">
    <rect width="1024" height="1024" rx="230" fill="url(#bg)" filter="url(#shadow)"/>
    <rect x="128" y="300" width="430" height="310" rx="44" fill="#e8eeff"/>
    <rect x="452" y="392" width="444" height="320" rx="48" fill="#0f1832" stroke="#6ea8fe" stroke-width="40"/>
    <path d="M612 540A140 140 0 0 1 736 540M640 590A84 84 0 0 1 708 590" fill="none" stroke="#6ea8fe" stroke-width="34" stroke-linecap="round"/>
    <circle cx="674" cy="636" r="22" fill="#6ea8fe"/>
  </g>
</svg>
