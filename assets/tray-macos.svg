<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!-- macOS menu bar glyph (a template image: only its shape counts; macOS
       tints it to match the menu bar). The app icon's two screens: a solid
       one behind, cut away around the outlined one receiving it, with one
       arc and a dot for "wireless" (two arcs blur at this size). -->
  <defs>
    <mask id="cut">
      <rect width="36" height="36" fill="#fff"/>
      <rect x="11.5" y="12" width="24" height="18.5" rx="4.5" fill="#000"/>
    </mask>
  </defs>
  <rect x="1.5" y="8.5" width="18" height="13" rx="2.5" fill="#000" mask="url(#cut)"/>
  <rect x="14.6" y="15.1" width="17.8" height="12.3" rx="2.3" fill="none" stroke="#000" stroke-width="2.4"/>
  <path d="M20 21.3A5 5 0 0 1 27 21.3" fill="none" stroke="#000" stroke-width="2.1" stroke-linecap="round"/>
  <circle cx="23.5" cy="24" r="1.45" fill="#000"/>
</svg>
