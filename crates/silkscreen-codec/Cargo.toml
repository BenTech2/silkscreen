[package]
name = "silkscreen-codec"
description = "Low-latency hardware video encode/decode for Silkscreen (FFmpeg)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
ffmpeg-sys-next = "9.0.1"
rayon = "1.12.0"
silkscreen-proto = { path = "../silkscreen-proto" }
tracing = "0.1.44"
# Loads the PyroWave library on first use (not on macOS, where it is linked in).
libloading = { version = "0.9.0", optional = true }

[features]
# PyroWave (experimental GPU codec), built from third_party/pyrowave: see
# build.rs. Needs the submodules, a C++ compiler and (except on macOS) CMake.
pyrowave = ["dep:cc", "dep:cmake", "dep:libloading"]

[build-dependencies]
cc = { version = "1.2", optional = true }
cmake = { version = "0.1.54", optional = true }
