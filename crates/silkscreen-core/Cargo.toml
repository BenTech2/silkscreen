[package]
name = "silkscreen-core"
description = "Silkscreen's shared core: identity and pairing, discovery, settings, and the display's network service"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
silkscreen-proto = { path = "../silkscreen-proto" }
anyhow = "1.0.104"
tracing = "0.1.44"
crossbeam-channel = "0.5.17"
socket2 = "0.6.5"
mdns-sd = "0.21.6"
gethostname = "1.1.0"
rand = "0.10.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
snow = "0.10.0"
spake2 = "0.4"
sha2 = "0.10"
serde_json = "1.0.154"
hex = "0.4.3"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
