[package]
name = "silkscreen"
description = "Turn any Windows, macOS or Linux computer into a wireless display"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
silkscreen-proto = { path = "../silkscreen-proto" }
silkscreen-codec = { path = "../silkscreen-codec" }
silkscreen-platform = { path = "../silkscreen-platform" }
silkscreen-core = { path = "../silkscreen-core" }
anyhow = "1.0.104"
tracing = "0.1.44"
crossbeam-channel = "0.5.17"
socket2 = "0.6.5"
mdns-sd = "0.21.6"
gethostname = "1.1.0"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
rand = "0.10.3"
wgpu = "30.0.1"
clap = { version = "4.6.7", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
winit = "0.30"
snow = "0.10.0"
spake2 = "0.4"
sha2 = "0.10"
serde_json = "1.0.154"
hex = "0.4.3"
directories = "6.0.0"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
# ksni: the Linux tray talks D-Bus directly, no GTK/libappindicator needed.
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[features]
default = ["pyrowave"]
# The experimental PyroWave codec (see crates/silkscreen-codec/build.rs).
pyrowave = ["silkscreen-codec/pyrowave"]

[build-dependencies]
embed-resource = "3.0.12"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", features = ["NSData"] }
